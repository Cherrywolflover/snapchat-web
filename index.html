<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassChat Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- INSTANT ACCESS PROFILE SETUP -->
    <div id="screen-profile" class="screen active">
        <div class="auth-container">
            <h2>Welcome to ClassChat</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Pick a username to start chatting instantly!</p>
            <div class="input-group">
                <label>Your Name</label>
                <input type="text" id="reg-name" placeholder="John Doe">
            </div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="reg-user" placeholder="johndoe123">
            </div>
            <button onclick="handleProfileSubmit()">BAM! Enter Chat</button>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="screen-main" class="screen">
        <div class="app-header">
            <h3 id="display-username">@username</h3>
            <button class="action-btn" onclick="logout()" style="background: transparent; color: var(--text-muted);">Log Out</button>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('chats')">Chats</div>
            <div class="tab" onclick="switchTab('servers')">Servers</div>
            <div class="tab" onclick="switchTab('friends')">Friends</div>
        </div>

        <div id="tab-chats" class="tab-content active">
            <div id="active-chats-list"></div>
        </div>

        <div id="tab-servers" class="tab-content">
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <input type="text" id="new-server-name" placeholder="Server name..." style="padding: 10px;">
                <button class="action-btn" onclick="createServer()">+ Create</button>
            </div>
            <div id="servers-list"></div>
        </div>

        <div id="tab-friends" class="tab-content">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <input type="text" id="search-friend-username" placeholder="Type classmate's username...">
                <button class="action-btn" onclick="sendFriendRequest()">Add</button>
            </div>
            <h4 style="margin-bottom: 10px; color: var(--text-muted)">Pending Requests</h4>
            <div id="pending-requests-list" style="margin-bottom: 20px;"></div>
            <h4 style="margin-bottom: 10px; color: var(--text-muted)">All Friends</h4>
            <div id="friends-list"></div>
        </div>
    </div>

    <!-- DEDICATED CHAT VIEW -->
    <div id="screen-chat-view" class="screen">
        <div class="app-header">
            <button class="icon-btn" onclick="backToMain()">←</button>
            <h3 id="chat-title">Chat</h3>
            <div id="chat-streak-status" class="streak-badge"></div>
        </div>
        <div class="chat-view">
            <div class="chat-messages" id="chat-messages-container"></div>
            <div class="chat-input-area">
                <button class="icon-btn" onclick="openCamera()">📷</button>
                <input type="text" id="chat-inline-input" placeholder="Send a message..." style="flex: 1;">
                <button class="icon-btn" onclick="sendTextMessage()">➔</button>
            </div>
        </div>
    </div>

    <!-- CAMERA OVERLAY COMPONENT -->
    <div id="camera-modal" class="camera-modal">
        <video id="camera-stream" autoplay playsinline></video>
        <div class="filter-bar">
            <div class="filter-thumb" onclick="applyFilter('filter-normal')">Normal</div>
            <div class="filter-thumb" onclick="applyFilter('filter-vintage')">Vintage</div>
            <div class="filter-thumb" onclick="applyFilter('filter-neon')">Neon</div>
            <div class="filter-thumb" onclick="applyFilter('filter-bw')">B&W</div>
        </div>
        <div style="padding: 20px; display: flex; justify-content: space-around; background: #000;">
            <button class="action-btn" onclick="closeCamera()" style="background: #333;">Cancel</button>
            <button class="action-btn" onclick="captureAndSendPhoto()" style="background: var(--online);">Snap & Send</button>
        </div>
    </div>

    <!-- FIXED TO MATCH YOUR GITHUB FILE NAME -->
    <script src="app.js"></script>
</body>
</html>
