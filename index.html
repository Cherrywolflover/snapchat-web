<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CherryChat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- AUTH -->
  <div id="auth" class="overlay">
    <div class="card auth-card">
      <header class="card-head">
        <div class="brand"><span class="logo-dot"></span> CherryChat</div>
        <nav class="tabs">
          <button class="tab active" data-panel="login">Login</button>
          <button class="tab" data-panel="register">Register</button>
        </nav>
      </header>

      <main class="card-body">
        <section id="panel-login" class="panel active">
          <label>Username<input id="login-username" /></label>
          <label>Password<input id="login-password" type="password" /></label>
          <button id="btn-login" class="btn primary">Enter</button>
        </section>

        <section id="panel-register" class="panel">
          <label>Username<input id="reg-username" /></label>
          <label>Display name<input id="reg-display" /></label>
          <label>Password<input id="reg-password" type="password" /></label>
          <label>Bio<input id="reg-bio" maxlength="120" /></label>
          <button id="btn-register" class="btn primary">Create</button>
        </section>
      </main>

      <footer class="card-foot">
        <small>Local-first demo • Profiles saved to localStorage</small>
      </footer>
    </div>
  </div>

  <!-- APP -->
  <div id="app" class="app-root" hidden>
    <aside class="col servers">
      <div class="server-logo">CC</div>
      <div id="servers" class="stack"></div>
      <button id="add-server" class="icon-btn">＋</button>
    </aside>

    <aside class="col channels">
      <div class="server-info">
        <h3 id="server-name">Cherry Lounge</h3>
        <p id="server-desc">Cozy chaos</p>
      </div>
      <div id="channel-list" class="list"></div>
      <div class="profile-bar">
        <div id="profile-avatar" class="avatar">C</div>
        <div class="meta">
          <div id="profile-name">Cherry</div>
          <div id="profile-status" class="status-pill"><span id="status-dot" class="dot online"></span><span id="status-text">Online</span></div>
        </div>
        <div class="actions">
          <button id="btn-profile" class="icon-btn">☺</button>
          <button id="btn-logout" class="icon-btn">⎋</button>
        </div>
      </div>
    </aside>

    <main class="col center">
      <header class="center-head">
        <div class="channel-title"><span>#</span><strong id="channel-name">general</strong></div>
        <div class="head-stats">
          <div>Streaks <span id="streak-count">0</span></div>
          <div>DMs <span id="dm-count">0</span></div>
        </div>
      </header>

      <section class="center-body">
        <div id="chat-feed" class="chat-feed" aria-live="polite"></div>

        <div class="media-row">
          <section class="snap-panel">
            <div class="panel-head">
              <strong>Snap Matrix</strong>
              <small>Live webcam + filters</small>
            </div>
            <div class="video-wrap">
              <video id="cam" autoplay playsinline muted></video>
              <canvas id="snap-canvas" aria-hidden="true"></canvas>
              <div class="filter-tag">Filter: <span id="filter-label">Neon</span></div>
            </div>

            <div class="filter-controls">
              <div class="filters">
                <button class="filter-btn active" data-filter="neon">Neon</button>
                <button class="filter-btn" data-filter="vintage">Vintage</button>
                <button class="filter-btn" data-filter="bw">B&amp;W</button>
                <button class="filter-btn" data-filter="grain">Film</button>
                <button class="filter-btn" data-filter="edge">Edge</button>
              </div>
              <div class="snap-actions">
                <button id="btn-snap" class="btn primary">Snap to chat</button>
              </div>
            </div>
          </section>

          <section class="tiktok-panel">
            <div class="panel-head">
              <strong>Vertical Scroll</strong>
              <small>TikTok-style feed</small>
            </div>
            <div id="tiktok-feed" class="tiktok-feed"></div>
          </section>
        </div>
      </section>

      <footer class="chat-input">
        <input id="msg-input" placeholder="Send a message..." />
        <button id="btn-send" class="btn primary">Send</button>
      </footer>
    </main>

    <aside class="col right">
      <header class="right-head">
        <strong>Presence</strong>
        <span id="online-count">0</span> online
      </header>

      <div id="user-list" class="list users"></div>

      <section class="friend-requests">
        <h4>Friend requests</h4>
        <div id="requests" class="list"></div>
      </section>
    </aside>
  </div>

  <audio id="ping" preload="auto">
    <source src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=" type="audio/wav">
  </audio>

  <script type="module" src="app.js"></script>
</body>
</html>
