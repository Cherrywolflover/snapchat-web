<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CherryChat :D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
    <script src="https://jsdelivr.net" crossorigin="anonymous"></script>
</head>
<body>

    <div class="app-container">
        
        <!-- SIDEBAR PANEL -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🍒 CherryChat</h2>
                <div class="profile-badge">👤 cheryl0</div>
            </div>
            
            <div class="chat-section">
                <h3>💬 Chats</h3>
                <div class="chat-item active-chat">
                    <span class="chat-icon">🤖</span>
                    <div class="chat-info">
                        <h4>Coding Assistant</h4>
                        <p>AI Tracking Active!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- CAMERA VIEWPORT -->
        <div class="camera-area" id="camera-click-zone">
            <video id="viewfinder" autoplay playsinline style="display:none;"></video>
            <canvas id="overlayCanvas"></canvas>
            <canvas id="photoCanvas" style="display:none;"></canvas>

            <div class="text-overlay-container" id="text-container" style="display: none;">
                <input type="text" id="snap-text" placeholder="Type something..." maxlength="45">
            </div>

            <!-- FILTER PANEL -->
            <div class="filter-selector">
                <button onclick="applyCherryFilter('none', event)" class="active" id="btn-none">None</button>
                <button onclick="applyCherryFilter('unicorn', event)" id="btn-unicorn">🦄 Horn</button>
                <button onclick="applyCherryFilter('halo', event)" id="btn-halo">😇 Halo</button>
                <button onclick="applyCherryFilter('glasses', event)" id="btn-glasses">😎 Glasses</button>
            </div>

            <div class="ui-container">
                <button id="shutter-btn"></button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
