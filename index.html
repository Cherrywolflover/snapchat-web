<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CherryChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-container">
      <div class="auth-logo">🍒</div>
      <h1>CherryChat</h1>
      <p>your vibe, your space</p>
      
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Login</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <div id="loginTab" class="auth-tab-content active">
        <input id="loginUser" type="text" placeholder="username" class="auth-input">
        <input id="loginPass" type="password" placeholder="password" class="auth-input">
        <button id="loginBtn" class="auth-btn">Login</button>
      </div>

      <div id="signupTab" class="auth-tab-content">
        <input id="signupUser" type="text" placeholder="username" class="auth-input">
        <input id="signupName" type="text" placeholder="display name" class="auth-input">
        <input id="signupPass" type="password" placeholder="password" class="auth-input">
        <input id="signupBio" type="text" placeholder="bio" class="auth-input">
        <button id="signupBtn" class="auth-btn">Create Account</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="app-screen" hidden>
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>CherryChat</h2>
        <div class="theme-toggle">
          <select id="themeSelect" class="theme-select">
            <option value="light">🌸 Soft Pink</option>
            <option value="aqua">💙 Pale Aqua</option>
            <option value="dark">🖤 Dark Neon</option>
          </select>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn active" data-view="chats">
          <span class="nav-icon">💬</span>
          <span>Chats</span>
        </button>
        <button class="nav-btn" data-view="camera">
          <span class="nav-icon">📸</span>
          <span>Snaps</span>
        </button>
        <button class="nav-btn" data-view="profile">
          <span class="nav-icon">👤</span>
          <span>Profile</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- CHATS VIEW -->
      <div id="chatsView" class="view active">
        <div class="chats-header">
          <h3>Messages</h3>
          <button id="newChatBtn" class="new-chat-btn">+</button>
        </div>
        <div id="chatsList" class="chats-list"></div>
      </div>

      <!-- CAMERA VIEW (SPLIT LAYOUT) -->
      <div id="cameraView" class="view camera-view">
        <div class="camera-layout">
          <!-- CAMERA ON LEFT -->
          <div class="camera-side">
            <div class="camera-container">
              <video id="videoFeed" autoplay playsinline muted></video>
              <canvas id="filterCanvas"></canvas>
              <div class="filter-indicator">Filter: <span id="filterName">Neon</span></div>
            </div>

            <div class="filters-bar">
              <button class="filter-btn active" data-filter="neon">Neon</button>
              <button class="filter-btn" data-filter="vintage">Vintage</button>
              <button class="filter-btn" data-filter="bw">B&W</button>
              <button class="filter-btn" data-filter="film">Film</button>
              <button class="filter-btn" data-filter="edge">Edge</button>
              <button class="filter-btn" data-filter="blur">Blur</button>
              <button class="filter-btn" data-filter="saturate">Saturate</button>
            </div>

            <div class="snap-actions">
              <button id="snapToChat" class="snap-btn primary">📸 Send</button>
              <button id="snapToStory" class="snap-btn">📖 Story</button>
              <button id="snapToGallery" class="snap-btn">💾 Save</button>
            </div>
          </div>

          <!-- CHAT ON RIGHT -->
          <div class="chat-side hidden" id="cameraChat">
            <div class="chat-header-bar">
              <div class="chat-user-info">
                <div id="cameraChatAvatar" class="avatar small"></div>
                <div>
                  <h3 id="cameraChatName"></h3>
                  <p id="cameraChatStatus" class="muted"></p>
                </div>
              </div>
              <div class="streak-display">
                <span id="cameraStreakCount">0</span>🔥
              </div>
            </div>
            <div id="cameraMessagesFeed" class="messages-feed"></div>
            <div class="message-input-area">
              <input id="cameraMsgInput" type="text" placeholder="Send a message..." class="message-input">
              <button id="cameraSendBtn" class="send-btn">Send</button>
            </div>
          </div>
        </div>
      </div>

      <!-- PROFILE VIEW -->
      <div id="profileView" class="view">
        <div class="profile-header">
          <div class="profile-avatar-container">
            <div id="profileAvatar" class="avatar large"></div>
            <div id="storyRing" class="story-ring hidden"></div>
          </div>
          <div class="profile-info">
            <h2 id="profileName"></h2>
            <p id="profileUsername" class="muted"></p>
            <p id="profileBio"></p>
            <p id="profileStatus" class="status-text"></p>
          </div>
        </div>

        <div class="profile-actions">
          <label class="upload-btn">📷 Change Avatar
            <input id="avatarInput" type="file" accept="image/*" hidden>
          </label>
          <button id="setStatusBtn" class="status-btn">Set Mood</button>
        </div>

        <div class="gallery-section">
          <h4>Gallery</h4>
          <div id="galleryGrid" class="gallery-grid"></div>
        </div>

        <div class="story-section">
          <h4>Your Story 🔥</h4>
          <div id="storyGrid" class="story-grid"></div>
        </div>
      </div>
    </main>

    <!-- CHAT MODAL (FOR CHATS VIEW) -->
    <div id="chatModal" class="chat-modal hidden">
      <div class="chat-container">
        <div class="chat-header-bar">
          <button id="closeChat" class="close-btn">←</button>
          <div class="chat-user-info">
            <div id="chatAvatar" class="avatar small"></div>
            <div>
              <h3 id="chatUserName"></h3>
              <p id="chatUserStatus" class="muted"></p>
            </div>
          </div>
          <div class="streak-display">
            <span id="streakCount">0</span>🔥
          </div>
        </div>

        <div id="messagesFeed" class="messages-feed"></div>

        <div class="message-input-area">
          <input id="messageInput" type="text" placeholder="Send a message..." class="message-input">
          <button id="sendMessageBtn" class="send-btn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
