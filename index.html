<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cherry Chat Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Crisp view camera element -->
        <video id="viewfinder" autoplay playsinline></video>
        
        <!-- Live Snap Overlay Canvas -->
        <canvas id="photoCanvas" style="display:none;"></canvas>

        <!-- Big Screen-Centered Graphic Filter Display Overlay -->
        <div id="filter-graphic-overlay"></div>

        <!-- Snapchat Style Text Overlay Box -->
        <div class="text-overlay-container" id="text-container">
            <input type="text" id="snap-text" placeholder="Tap to type..." maxlength="50">
        </div>

        <!-- Filter Action Selection Carousel -->
        <div class="filter-selector">
            <button onclick="applySnapFilter('none')" class="active">None</button>
            <button onclick="applySnapFilter('unicorn')">🦄 Unicorn</button>
            <button onclick="applySnapFilter('halo')">😇 Angel</button>
            <button onclick="applySnapFilter('glasses')">😎 Sunglasses</button>
            <button onclick="applySnapFilter('dog')">🐶 Dog</button>
            <button onclick="applySnapFilter('cat')">🐱 Cat</button>
        </div>

        <!-- UI Elements -->
        <div class="ui-container">
            <button id="shutter-btn"></button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
