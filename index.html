<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CherryChat :D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- SIDEBAR DRAWER PANEL -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>🍒 CherryChat</h2>
                <div class="profile-badge" id="user-display-tag">👤 cheryl0</div>
            </div>
            
            <!-- Dynamic Messaging Panel Area -->
            <div class="chat-section" id="active-chat-tray">
                <h3>💬 Chats</h3>
                <div class="chat-item active-chat">
                    <span class="chat-icon">🤖</span>
                    <div class="chat-info">
                        <h4>Coding Assistant</h4>
                        <p>Let's activate real chats next!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- RE-ENGINEERED CAMERA INTERFACE -->
        <div class="camera-area" id="camera-click-zone">
            <video id="viewfinder" autoplay playsinline></video>
            <canvas id="photoCanvas" style="display:none;"></canvas>
            
            <!-- Graphic canvas overlay layer replacing text blocks -->
            <canvas id="overlayCanvas"></canvas>

            <!-- Dynamic Hidden Context Input Field -->
            <div class="text-overlay-container" id="text-container" style="display: none;">
                <input type="text" id="snap-text" placeholder="Type something..." maxlength="45">
            </div>

            <!-- FILTER ROTATION PANEL -->
            <div class="filter-selector">
                <button onclick="applyCherryFilter('none')" class="active" id="btn-none">None</button>
                <button onclick="applyCherryFilter('unicorn')" id="btn-unicorn">🦄 Horn</button>
                <button onclick="applyCherryFilter('halo')" id="btn-halo">😇 Halo</button>
                <button onclick="applyCherryFilter('glasses')" id="btn-glasses">😎 Glasses</button>
            </div>

            <div class="ui-container">
                <button id="shutter-btn"></button>
            </div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
